{% extends "base.html" %}
{% block content %}
<div class="min-h-screen min-h-dvh flex items-center justify-center">
  <div class="w-full max-w-md neu-surface p-6 sm:p-7">
    <div class="mb-6">
      <div class="inline-flex items-center gap-2 text-xs uppercase tracking-wide text-gb-fg/70 mb-2">
        <span class="material-symbols-rounded" aria-hidden="true">admin_panel_settings</span>
        TimeStat Admin
      </div>
      <h1 class="text-2xl font-semibold text-gb-fg flex items-center gap-2">
        <span class="material-symbols-rounded" aria-hidden="true">verified_user</span>
        Admin sign in
      </h1>
      <p class="text-sm mt-2 text-gb-fg/75">Manage users and remove their tasks.</p>
    </div>

    <form method="post" class="space-y-4">
      <label class="block">
        <span class="text-sm text-gb-fg/85">Admin code</span>
        <span class="mt-1 flex items-center gap-2">
          <input id="adminCodeInput" name="code" type="password" required autocomplete="current-password" autofocus class="neu-input flex-1">
          <button id="toggleAdminCodeBtn" class="neu-btn border border-gb-bg2 bg-gb-bg1 text-gb-fg inline-flex items-center gap-1 text-xs px-2 py-1" type="button" aria-label="Show admin code" data-tooltip="Show admin code">
            <span class="material-symbols-rounded" aria-hidden="true">visibility</span>
            <span class="btn-label">Show</span>
          </button>
        </span>
      </label>
      <button class="w-full neu-btn bg-gb-blue text-gb-bg0 border-gb-blue/80 inline-flex items-center justify-center gap-2">
        <span class="material-symbols-rounded" aria-hidden="true">login</span>
        Sign in as admin
      </button>
    </form>

    <p class="mt-5 text-sm text-gb-fg/75 text-center">
      <a class="font-medium text-gb-purple hover:text-gb-blue inline-flex items-center gap-1" href="{{ url_for('login') }}">
        <span class="material-symbols-rounded" aria-hidden="true">arrow_back</span>
        Back to user login
      </a>
    </p>
  </div>
</div>
<script>
  const adminCodeInput = document.getElementById("adminCodeInput");
  const toggleAdminCodeBtn = document.getElementById("toggleAdminCodeBtn");
  toggleAdminCodeBtn.addEventListener("click", () => {
    const show = adminCodeInput.type === "password";
    adminCodeInput.type = show ? "text" : "password";
    const icon = toggleAdminCodeBtn.querySelector(".material-symbols-rounded");
    const label = toggleAdminCodeBtn.querySelector(".btn-label");
    if (icon) icon.textContent = show ? "visibility_off" : "visibility";
    if (label) label.textContent = show ? "Hide" : "Show";
    toggleAdminCodeBtn.setAttribute("aria-label", show ? "Hide admin code" : "Show admin code");
    toggleAdminCodeBtn.setAttribute("data-tooltip", show ? "Hide admin code" : "Show admin code");
    adminCodeInput.focus();
  });
</script>
{% endblock %}
